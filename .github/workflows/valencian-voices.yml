name: Valencian voice samples

# A listening page to choose the Valencian voice: scripts/audio/valencian_samples.py (saved to the branch valencian-samples)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Voices
        run: |
          pip install -q piper-tts lameenc numpy onnxruntime
          mkdir -p /tmp/voices
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          for p in ca/ca_ES/upc_ona/medium/ca_ES-upc_ona-medium ca/ca_ES/upc_pau/x_low/ca_ES-upc_pau-x_low; do
            for e in .onnx .onnx.json; do curl -sfL "$HF/$p$e" -o "/tmp/voices/$(basename $p)$e"; done
          done
          curl -sfL https://huggingface.co/projecte-aina/matxa-tts-cat-multispeaker/resolve/main/matcha_hifigan_simply.onnx -o /tmp/matxa.onnx || echo "no matxa"
          ls -la /tmp/voices /tmp/matxa.onnx
      - name: Page
        run: python scripts/audio/valencian_samples.py /tmp/voices /tmp/matxa.onnx /tmp/Lectorix-voces-valenciano.html
      - name: Save to the valencian-samples branch
        run: |
          mkdir /tmp/pub && cd /tmp/pub && git init -q && git checkout -q -b valencian-samples
          split -b 40m -d /tmp/Lectorix-voces-valenciano.html Lectorix-voces-valenciano.html.part
          git config user.name lectorix-bot; git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm samples
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:valencian-samples
