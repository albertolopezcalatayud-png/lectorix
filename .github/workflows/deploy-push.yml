name: Deploy push reminder server

# Deploys push-worker/ to Cloudflare Workers (free plan), then writes its URL
# into public/push-config.json so the app starts using real push reminders.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Without them the job exits cleanly and the app keeps the in-app reminders.

on:
  push:
    branches: [main]
    paths: ['push-worker/**', '.github/workflows/deploy-push.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: push-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set yet — skipping push server deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install wrangler
        if: steps.creds.outputs.ready == 'true'
        run: npm install -g wrangler@4

      - name: Ensure KV namespace
        if: steps.creds.outputs.ready == 'true'
        working-directory: push-worker
        run: |
          ID=$(wrangler kv namespace list | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s.slice(s.indexOf("[")));
              const n=j.find(x=>x.title==="lectorix-push-subs");
              process.stdout.write(n?n.id:"");});')
          if [ -z "$ID" ]; then
            wrangler kv namespace create lectorix-push-subs > kv.out 2>&1; cat kv.out
            ID=$(grep -oE '[0-9a-f]{32}' kv.out | head -1)
          fi
          [ -n "$ID" ] || { echo "::error::Could not create or find the KV namespace"; exit 1; }
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
          echo "KV namespace: $ID"

      - name: Deploy worker
        if: steps.creds.outputs.ready == 'true'
        working-directory: push-worker
        run: |
          wrangler deploy 2>&1 | tee deploy.out
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.out | head -1)
          [ -n "$URL" ] || { echo "::error::Deploy finished but no workers.dev URL found"; exit 1; }
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Health check (also creates the VAPID keys on first run)
        if: steps.creds.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/key" | grep -q publicKey; then echo "Server OK: $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::Push server did not answer at $URL/key"; exit 1

      - name: Point the app at the server
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{ "api": "%s" }\n' "$URL" > public/push-config.json
          if git diff --quiet public/push-config.json; then
            echo "push-config.json already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add public/push-config.json
            git commit -m "chore: point app at push server $URL"
            git push
            gh workflow run deploy.yml --ref main   # bot pushes don't trigger workflows by themselves
          fi
          echo "### ✅ Push server deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
