name: Free voice samples (Piper and Matxa)

# Generates listening samples with free neural voices (no accounts needed) into the "voice-samples" branch:
# Piper voices for Spanish, British English and Catalan, and Matxa (Projecte AINA) with Valencian accent.
# Samples are only for choosing; each voice's licence is saved next to it (MODEL_CARD).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg build-essential autoconf automake libtool pkg-config > /dev/null
          pip install -q piper-tts==1.2.0 onnxruntime phonemizer scipy unidecode fastapi soundfile "huggingface_hub[cli]" uvicorn
      - name: Piper voices
        run: |
          mkdir -p out/piper voices
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          while read lang path name; do
            [ -z "$lang" ] && continue
            for f in "$name.onnx" "$name.onnx.json" "MODEL_CARD"; do
              curl -sfL "$HF/$path/$f" -o "voices/${name}__$f" || echo "missing $path/$f"
            done
            [ -f "voices/${name}__$name.onnx" ] || continue
            cp "voices/${name}__MODEL_CARD" "out/piper/$name.MODEL_CARD.txt" 2>/dev/null || true
            i=0
            python - "$lang" > /tmp/lines.txt <<'PY'
          import json,sys; [print(t) for t in json.load(open('scripts/audio/samples.json'))[sys.argv[1]]]
          PY
            while IFS= read -r line; do
              echo "$line" | piper --model "voices/${name}__$name.onnx" --config "voices/${name}__$name.onnx.json" --output_file "out/piper/$name.$i.wav" -q 2>/dev/null || echo "fail $name $i"
              ffmpeg -nostdin -loglevel error -y -i "out/piper/$name.$i.wav" -ac 1 -b:a 64k "out/piper/$name.$i.mp3" && rm "out/piper/$name.$i.wav"
              i=$((i+1))
            done < /tmp/lines.txt
            echo "ok $name"
          done <<'LIST'
          es es/es_ES/davefx/medium es_ES-davefx-medium
          es es/es_ES/sharvard/medium es_ES-sharvard-medium
          es es/es_ES/carlfm/x_low es_ES-carlfm-x_low
          es es/es_ES/mls_10246/low es_ES-mls_10246-low
          en en/en_GB/alba/medium en_GB-alba-medium
          en en/en_GB/cori/high en_GB-cori-high
          en en/en_GB/jenny_dioco/medium en_GB-jenny_dioco-medium
          en en/en_GB/southern_english_female/low en_GB-southern_english_female-low
          en en/en_GB/northern_english_male/medium en_GB-northern_english_male-medium
          ca ca/ca_ES/upc_ona/medium ca_ES-upc_ona-medium
          ca ca/ca_ES/upc_pau/x_low ca_ES-upc_pau-x_low
          LIST
      - name: Matxa (Projecte AINA) with Valencian accent
        continue-on-error: true
        run: |
          git clone -q -b dev-ca https://github.com/projecte-aina/espeak-ng /tmp/espeak-ng
          (cd /tmp/espeak-ng && ./autogen.sh > /dev/null && ./configure --prefix=/usr -q > /dev/null && make -s -j4 > /dev/null && sudo make install > /dev/null)
          git clone -q https://github.com/langtech-bsc/minimal-tts-api /tmp/matxa
          cd /tmp/matxa
          hf download projecte-aina/matxa-tts-cat-multiaccent matxa_multiaccent_wavenext_e2e.onnx --local-dir .
          hf download projecte-aina/matxa-tts-cat-multiaccent config.yaml --local-dir .
          curl -sfL https://huggingface.co/projecte-aina/matxa-tts-cat-multiaccent/raw/main/README.md -o $GITHUB_WORKSPACE/matxa-README.md || true
          (python3 -u app.py > /tmp/matxa.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8000/docs && break; sleep 2; done
          mkdir -p $GITHUB_WORKSPACE/out/matxa
          cd $GITHUB_WORKSPACE
          python - <<'PY'
          import json, urllib.request, subprocess
          lines = json.load(open('scripts/audio/samples.json'))['ca']
          for accent, voice in [('valencia', 'lluc'), ('valencia', 'gina'), ('central', 'elia'), ('central', 'grau')]:
              for i, t in enumerate(lines):
                  req = urllib.request.Request('http://localhost:8000/api/tts', data=json.dumps({'text': t, 'voice': voice, 'accent': accent, 'type': 'text'}).encode(), headers={'Content-Type': 'application/json'})
                  try:
                      wav = urllib.request.urlopen(req, timeout=120).read()
                      open(f'out/matxa/{accent}-{voice}.{i}.wav', 'wb').write(wav)
                      subprocess.run(['ffmpeg', '-loglevel', 'error', '-y', '-i', f'out/matxa/{accent}-{voice}.{i}.wav', '-ac', '1', '-b:a', '64k', f'out/matxa/{accent}-{voice}.{i}.mp3'], check=True)
                      print('ok', accent, voice, i)
                  except Exception as e:
                      print('fail', accent, voice, i, e)
          PY
          rm -f out/matxa/*.wav; cp matxa-README.md out/matxa/MODEL_CARD.txt 2>/dev/null || true
          tail -20 /tmp/matxa.log
      - name: Save to the voice-samples branch
        run: |
          cp scripts/audio/samples.json out/
          cd out && git init -q && git checkout -q -b voice-samples
          git config user.name "lectorix-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Voice samples" && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-samples
          find . -name '*.mp3' | wc -l
