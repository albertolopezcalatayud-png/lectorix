name: Letter-by-letter check comparison

on:
  workflow_dispatch:
    inputs:
      sentences:
        description: Sentences per language and voice
        default: '30'
      m_es:
        description: Spanish models to try (first that loads)
        default: 'stt_es_citrinet_512'
      m_ca:
        default: 'stt_ca_conformer_ctc_large'
      m_en:
        default: 'stt_en_citrinet_512'
      langs:
        default: 'es,ca,en'

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Tools and voices
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1 ffmpeg > /dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q "nemo_toolkit[asr]" piper-tts huggingface_hub
          mkdir -p /tmp/voices
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          for p in es/es_ES/davefx/medium/es_ES-davefx-medium es/es_ES/sharvard/medium/es_ES-sharvard-medium ca/ca_ES/upc_ona/medium/ca_ES-upc_ona-medium ca/ca_ES/upc_pau/x_low/ca_ES-upc_pau-x_low en/en_GB/cori/high/en_GB-cori-high en/en_GB/northern_english_male/medium/en_GB-northern_english_male-medium; do
            for e in .onnx .onnx.json; do curl -sfL "$HF/$p$e" -o "/tmp/voices/$(basename $p)$e"; done
          done
          ls -la /tmp/voices | head
      - name: Compare
        env:
          N_SENT: ${{ inputs.sentences }}
          M_ES: ${{ inputs.m_es }}
          M_CA: ${{ inputs.m_ca }}
          M_EN: ${{ inputs.m_en }}
          LANGS: ${{ inputs.langs }}
        run: python scripts/asr/verify_eval.py /tmp/voices 2>&1 | grep -v -E "^\[NeMo W|warnings.warn|^ *$"
