name: Android app test

# Builds the native app, installs it on emulators and checks it end to end:
# launch (release build), then screens, voice and photo reading (debug build,
# driven through the WebView debugger). Results go to android-test-<api>.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-test.yml', '.github/scripts/**', 'android/**']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: google_apis_playstore
          - api: 35
            target: google_apis_playstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web app and native project
        run: |
          npm ci
          npm run build:app
          npx cap sync android
      - name: Build release and debug APKs
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon
          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          keytool -genkeypair -keystore /tmp/test.jks -storepass android -keypass android -alias test -keyalg RSA -dname "CN=test" -validity 100
          java -jar /tmp/bundletool.jar build-apks --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=/tmp/app.apks --mode=universal --ks=/tmp/test.jks --ks-pass=pass:android --ks-key-alias=test --key-pass=pass:android
          cd /tmp && unzip -o app.apks universal.apk
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" /tmp/debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/launch-test.sh ${{ matrix.api }}
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r /tmp/out-* /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q && git checkout -q -b android-test-${{ matrix.api }}
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          echo "App test of ${GITHUB_SHA}" > README.md
          git add . && git commit -q -m "App test ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-test-${{ matrix.api }}
