name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Natural-voice audio (branch "audio", from audio.yml) and reading-recogniser models (branch "asr-models", from asr.yml)
      - name: Add audio and recogniser models
        run: |
          for pair in audio:audio asr-models:asr; do
            br=${pair%%:*}; dir=${pair#*:}
            if git fetch --depth 1 origin $br 2>/dev/null; then
              mkdir -p dist/$dir && git archive FETCH_HEAD | tar -x -C dist/$dir && echo "$dir: $(find dist/$dir -type f | wc -l) files, $(du -sh dist/$dir | cut -f1)"
            else echo "no $br branch yet"; fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
