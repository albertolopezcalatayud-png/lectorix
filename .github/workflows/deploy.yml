name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Natural-voice audio (generated by audio.yml into the "audio" branch), served at /lectorix/audio/
      - name: Add natural-voice audio
        run: |
          if git fetch --depth 1 origin audio 2>/dev/null; then
            mkdir -p dist/audio && git --work-tree=dist/audio checkout FETCH_HEAD -- . && echo "audio: $(find dist/audio -name '*.mp3' | wc -l) clips"
          else echo "no audio branch yet"; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
