name: Reading recogniser comparison

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg: ['6 3 0', '4 4 150', '3 4 300', '3 5 500']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Tools, voices and models
        run: |
          pip install -q piper-tts vosk numpy
          mkdir -p /tmp/voices /tmp/vosk
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          for p in es/es_ES/davefx/medium/es_ES-davefx-medium es/es_ES/sharvard/medium/es_ES-sharvard-medium ca/ca_ES/upc_ona/medium/ca_ES-upc_ona-medium en/en_GB/cori/high/en_GB-cori-high en/en_GB/northern_english_male/medium/en_GB-northern_english_male-medium; do
            for e in .onnx .onnx.json; do curl -sfL "$HF/$p$e" -o "/tmp/voices/$(basename $p)$e"; done
          done
          for m in vosk-model-small-es-0.42 vosk-model-small-ca-0.4 vosk-model-small-en-us-0.15; do
            curl -sfL "https://alphacephei.com/vosk/models/$m.zip" -o /tmp/m.zip && unzip -q /tmp/m.zip -d /tmp/vosk && du -sh /tmp/vosk/$m
          done
      - name: Compare
        run: |
          set -- ${{ matrix.cfg }}
          echo "CONFIG rivals=$1 minlen=$2 skiptop=$3"
          NB_PER_WORD=$1 NB_MIN_LEN=$2 NB_SKIP_TOP=$3 python scripts/asr/eval2.py /tmp/voices /tmp/vosk 2>/dev/null
