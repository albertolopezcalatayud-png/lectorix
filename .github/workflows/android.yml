name: Build Android app bundle

# Builds an UNSIGNED release bundle. Signing is done outside GitHub with the
# upload key, which is never stored in this repository.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (must increase on every Play upload)'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
        run: gradle bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lectorix-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
