name: Natural voices (Piper)

# Generates the audio of the fixed texts with free Piper voices (scripts/audio/voices.json) and keeps it in the
# "audio" branch, which the web publishes at /lectorix/audio/. Only missing clips are generated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/data/**', 'scripts/audio/**', '.github/workflows/audio.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Audio branch
        run: |
          if git fetch origin audio:audio 2>/dev/null; then git worktree add audio-out audio
          else git worktree add --detach audio-out && cd audio-out && git checkout -q --orphan audio && (git rm -rfq . || true); fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Tools and voices
        run: |
          pip install -q piper-tts onnx lameenc numpy
          npm i --no-save --no-audit --no-fund tsx@4 > /dev/null
          mkdir -p /tmp/voices
          python - <<'PY'
          import json, os, urllib.request
          HF = 'https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/'
          for lang, voices in json.load(open('scripts/audio/voices.json')).items():
              for v in voices:
                  for ext in ('.onnx', '.onnx.json'):
                      dst = '/tmp/voices/' + os.path.basename(v['model']) + ext
                      if not os.path.exists(dst): urllib.request.urlretrieve(HF + v['model'] + ext, dst)
                  print('voice', v['id'])
          PY
      - name: Texts
        run: npx tsx --tsconfig tsconfig.app.json scripts/audio/collect.ts > /tmp/texts.json
      - name: Generate
        run: python scripts/audio/generate_piper.py /tmp/texts.json /tmp/voices audio-out
      - name: Save
        run: |
          cd audio-out
          git config user.name "lectorix-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Audio: $(git diff --cached --name-only | grep -c '\.mp3$') clips"
          git push -q origin HEAD:audio
          echo "changed=1" >> $GITHUB_ENV
      - name: Publish the web with the new audio
        if: env.changed == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run deploy.yml --ref main
