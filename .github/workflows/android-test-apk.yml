name: Android launch test (Play-signed APK)

# Runs the launch test on the exact APK generated and signed by Google Play,
# taken from the android-apk-test branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: google_apis_playstore
          - api: 31
            target: google_apis_playstore
    steps:
      - uses: actions/checkout@v4
      - name: Get Play-signed APK
        run: |
          git fetch -q origin android-apk-test
          git show origin/android-apk-test:play-universal.apk > /tmp/universal.apk
          ls -la /tmp/universal.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/launch-test.sh play-${{ matrix.api }}
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r /tmp/out-* /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q && git checkout -q -b android-test-play-${{ matrix.api }}
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          echo "Play APK launch test of ${GITHUB_SHA}" > README.md
          git add . && git commit -q -m "Play APK launch test"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-test-play-${{ matrix.api }}
